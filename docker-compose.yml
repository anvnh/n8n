services:
  # PostgreSQL DB
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    env_file: .env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # PGAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    restart: always
    env_file: .env.pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # redis
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

  # n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_app
    restart: always
    env_file: .env.n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    depends_on:
      - postgres

  # PostgREST API
  postgrest:
    image: postgrest/postgrest
    container_name: postgrest_api
    restart: always
    env_file: .env.postgrest
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
