version: '3.8'

services:
  # PostgreSQL DB
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=n8n_password
      - POSTGRES_DB=finance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # PGAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # redis
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"

  # n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_app
    restart: always
    ports:
      - "5678:5678"
    environment:
      # - N8N_HOST=localhost
      # - N8N_PORT=5678
      # - N8N_PROTOCOL=http
      # - NODE_ENV=production
      # - WEBHOOK_URL=https://n8naan.duckdns.org:5678
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=finance_db
      # - DB_POSTGRESDB_USER=n8n_user
      # - DB_POSTGRESDB_PASSWORD=n8n_password

      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8naan.duckdns.org/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=finance_db
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=n8n_password
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows
    depends_on:
      - postgres

  # PostgREST API
  postgrest:
    image: postgrest/postgrest
    container_name: postgrest_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://n8n_user:n8n_password@postgres:5432/finance_db
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: n8n_user
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
