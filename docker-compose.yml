services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=https://investigate-induction-revised-lips.trycloudflare.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://investigate-induction-revised-lips.trycloudflare.com
      - NODE_ENV=production
    volumes:
      - ./n8n_data:/home/node/.n8n
